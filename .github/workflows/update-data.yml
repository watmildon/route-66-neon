name: Update neon sign data

on:
  schedule:
    # Signs: daily at 07:41 UTC — off the hour to dodge GitHub's busiest cron
    # slots and the 04:00 UTC Overpass crunch.
    - cron: '41 7 * * *'
    # Route line: weekly (Monday 08:17 UTC); the alignment rarely changes.
    - cron: '17 8 * * 1'
  workflow_dispatch:
    inputs:
      refresh_route:
        description: Also re-download the Route 66 line from Overpass
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    name: Refresh signs (and route) from OSM
    runs-on: ubuntu-latest
    env:
      NEON_USER_AGENT: ${{ vars.USER_AGENT || 'route-66-neon/1.0 (+https://github.com/watmildon/route-66-neon)' }}
      NEON_BUFFER_M: ${{ vars.BUFFER_M || '400' }}
      NEON_DROP_THRESHOLD: ${{ vars.DROP_THRESHOLD || '50' }}
      NEON_MAX_DATA_LAG_HOURS: ${{ vars.MAX_DATA_LAG_HOURS || '48' }}
      # Optional private Overpass instance. Empty → public mirrors.
      OVERPASS_PRIMARY_URL: ${{ secrets.OVERPASS_PRIMARY_URL }}
      # Optional backup private instance, tried after the primary. Empty → skipped.
      OVERPASS_SECONDARY_URL: ${{ secrets.OVERPASS_SECONDARY_URL }}
      # Mapillary client token for aiming 360° photos at newly tagged signs.
      # Needs Read access (Graph API computed_compass_angle); a tiles-only
      # token falls back to guessing the lens side. Empty → not aimed.
      MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Refresh the Route 66 line (Overpass)
        if: github.event.schedule == '17 8 * * 1' || inputs.refresh_route
        # If Overpass is unavailable, keep going with the committed line.
        continue-on-error: true
        run: node scripts/fetch-route.mjs

      - name: Fetch neon signs (Postpass, Overpass fallback)
        run: node scripts/fetch-signs.mjs

      # OSM data problems don't fail the run: fetch-signs leaves them off the
      # map and lists them in data/issues.md, which is committed below.
      - name: Report data issues
        run: |
          if [ -f data/issues.md ]; then
            cat data/issues.md >> "$GITHUB_STEP_SUMMARY"
            n=$(grep -c '^| \[' data/issues.md || true)
            if [ "$n" -gt 0 ]; then echo "::warning title=Data issues::$n OSM data issue(s), see data/issues.md"; fi
          fi

      - name: Test code and data
        run: npm test

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signs.geojson data/route66.geojson data/alignments.geojson data/issues.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update neon sign data from OSM"
            git push
          fi
