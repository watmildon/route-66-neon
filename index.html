<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Route 66 Neon</title>
  <meta name="description" content="Neon signs along Historic Route 66, mapped on OpenStreetMap by #mapping-route-66-neon volunteers.">
  <meta name="theme-color" content="#0b0b12">
  <!-- Link previews (Slack, Discord, iMessage …). Previewers don't send the
       #node/… part or run scripts, so every link gets this same card. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Route 66 Neon">
  <meta property="og:title" content="Route 66 Neon">
  <meta property="og:description" content="Neon signs along Historic Route 66, Chicago to Santa Monica, mapped on OpenStreetMap by #mapping-route-66-neon volunteers.">
  <meta property="og:url" content="https://watmildon.github.io/route-66-neon/">
  <meta property="og:image" content="https://watmildon.github.io/route-66-neon/img/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Route 66 Neon: a dark map of the route from Los Angeles to Chicago dotted with glowing pink signs">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b0b12'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ff2bd6' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="map" aria-label="Map of neon signs along Route 66"></div>

  <aside id="sidebar">
    <header>
      <div class="title-row">
        <h1 class="neon-title">Route 66 <span>Neon</span></h1>
        <button id="sidebar-toggle" class="icon-btn" aria-expanded="true" aria-controls="sidebar-body" title="Hide the list" aria-label="Hide the list">
          <svg class="caret" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>
    <div id="sidebar-body" class="sidebar-body">
      <input id="filter" type="search" placeholder="Filter signs…" aria-label="Filter signs" autocomplete="off">
      <div id="chips" class="chips" role="group" aria-label="Show only signs with"></div>
      <p class="list-hint">Chicago <span aria-hidden="true">→</span> Santa Monica<span id="sign-count" aria-live="polite"></span></p>
      <ol id="sign-list"></ol>
      <footer>
        <p class="legend">
          <span class="legend-item"><span class="legend-dot" aria-hidden="true"></span> Neon sign</span>
          <span class="legend-item" title="Tagged with a disused: prefix: out of service"><span class="legend-dot disused" aria-hidden="true"></span> Disused</span>
          <span class="legend-item" title="Tagged with an abandoned: prefix: in disrepair"><span class="legend-dot abandoned" aria-hidden="true"></span> Abandoned</span>
          <span class="legend-item"><span class="legend-line" aria-hidden="true"></span> Historic Route 66</span>
          <span class="legend-item"><span class="legend-line alt" aria-hidden="true"></span> Other former US 66</span>
        </p>
        <p>Know a sign that's missing? Add it with <code>advertising=sign</code> + <code>luminous=yes</code> + <code>light:method=neon</code>.</p>
      </footer>
    </div>
  </aside>

  <section id="detail" class="detail" hidden aria-live="polite" aria-label="Sign details"></section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
